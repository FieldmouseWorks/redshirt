[package]
name = "redshirt"
default-run = "redshirt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded experiments through trusted adapters and candidate-only providers"
publish = false

[features]
default = []
jev-http = ["dep:reqwest"]
choice-http = ["dep:reqwest"]

[dependencies]
async-trait = "0.1.89"
getrandom = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "sync", "process", "io-util", "signal", "net"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tempfile = "3.27.0"
tiktoken-rs = "=0.12.0"
