[package]
name = "redshirt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded experiments through trusted adapters and candidate-only providers"
publish = false

[dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "sync", "process", "io-util", "signal"] }
tokio-util = { version = "0.7.18", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
