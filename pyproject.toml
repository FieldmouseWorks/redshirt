[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redshirt-runner"
version = "0.1.0"
description = "Bounded external experiments with candidate-only decisions and concrete replay"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools]
packages = ["redshirt"]
